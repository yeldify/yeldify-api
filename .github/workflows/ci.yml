name: CI API

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Testes alterados pela PR (gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Coletar testes alterados
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="HEAD~1"
          fi
          git diff --name-only "$BASE" HEAD | grep -E '^tests/.*test_[^/]*\.py$' | sort -u > /tmp/changed.txt || true
          count=$(wc -l < /tmp/changed.txt)
          echo "changed_count=$count" >> "$GITHUB_OUTPUT"
          echo "Testes alterados na PR: $count"
          cat /tmp/changed.txt

      - name: Rodar testes alterados (gate)
        if: steps.changed.outputs.changed_count != '0'
        run: |
          mapfile -t files < /tmp/changed.txt
          python -m pytest "${files[@]}" -q

      - name: Aviso — nenhum teste alterado
        if: steps.changed.outputs.changed_count == '0'
        run: 'echo "::warning::Nenhum arquivo de teste alterado nesta PR — regra do projeto: mudança anda com teste."'

  suite:
    name: Suíte completa (informativo)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Rodar suíte completa
        run: |
          python -m pytest -q | tee /tmp/pytest-full.txt; echo "--- resumo ---"; tail -5 /tmp/pytest-full.txt

  smoke:
    name: Smoke — rota de verdade (SEED_DEMO)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Subir API com seed
        run: |
          SEED_DEMO=true python -m uvicorn src.infrastructure.web.api.v1.api:app \
            --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &

      - name: Aguardar API de pé
        run: |
          for i in $(seq 1 15); do
            if curl -sf "http://127.0.0.1:8000/transacoes/?user_id=user-123" -o /tmp/resp.json; then
              echo "API de pé (tentativa $i)"
              break
            fi
            sleep 1
          done
          if [ ! -s /tmp/resp.json ]; then
            echo "API não subiu a tempo. Log:"
            tail -30 /tmp/api.log
            exit 1
          fi

      - name: Validar contrato da resposta
        run: |
          python - <<'PY'
          import json
          r = json.load(open('/tmp/resp.json'))
          assert isinstance(r.get("items"), list), r
          print("items:", len(r["items"]))
          if r["items"]:
              t = r["items"][0]
              assert t.get("budget_id"), t
              print("ok —", t["id"], "|", t["descricao"], "| budget:", t["budget_id"])
          PY